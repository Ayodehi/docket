name: Docket
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  ReviewKit:
    path: Packages/ReviewKit
targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: Docket
    dependencies:
      - package: ReviewKit
        product: GitHubKit
      - package: ReviewKit
        product: ReviewCore
      - package: ReviewKit
        product: Sync
      - package: ReviewKit
        product: Workspace
      - package: ReviewKit
        product: Persistence
    info:
      path: Docket/Info.plist
      properties:
        CFBundleDisplayName: Docket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSAppleEventsUsageDescription: Docket opens your terminal at a repository and starts commands such as Claude Code.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: Docket/Docket.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        # Release version: bump MARKETING_VERSION for each release and CURRENT_PROJECT_VERSION for every build you ship.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Docket
        PRODUCT_NAME: Docket
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
