name: Docket
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  ReviewKit:
    path: Packages/ReviewKit
  # Self-update for release builds; see docs/design/self-update.md before changing the version.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: Docket
    dependencies:
      - package: ReviewKit
        product: GitHubKit
      - package: ReviewKit
        product: ReviewCore
      - package: ReviewKit
        product: Sync
      - package: ReviewKit
        product: Workspace
      - package: ReviewKit
        product: Persistence
      - package: Sparkle
    info:
      path: Docket/Info.plist
      properties:
        CFBundleDisplayName: Docket
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: false
        LSApplicationCategoryType: public.app-category.developer-tools
        SUFeedURL: $(DOCKET_UPDATE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        NSAppleEventsUsageDescription: Docket opens your terminal at a repository and starts commands such as Claude Code.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    entitlements:
      path: Docket/Docket.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        # Release version: bump MARKETING_VERSION for each release and CURRENT_PROJECT_VERSION for every build you ship.
        MARKETING_VERSION: "0.3.4"
        CURRENT_PROJECT_VERSION: "8"
        # Empty except in builds made by tools/release.sh, so source builds never start the updater.
        DOCKET_UPDATE_FEED_URL: ""
        # Public half of the EdDSA key that signs updates; the private half is only in the release Mac's Keychain.
        SPARKLE_PUBLIC_KEY: s41X7lbfh6u34hTOKMGQqp1TallI38UdKCPA5wHY568=
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).Docket
        PRODUCT_NAME: Docket
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: NO
